# ===================================================================
# THE PRESCRIPTION LETTERHEAD
# ===================================================================
# This is the piece of paper the patient walks out with. It is often
# the only part of this whole system anybody outside the chamber ever
# sees, and it may be shown to another doctor, a pharmacist, or a
# hospital years from now.
#
# EVERY LINE BELOW IS A PLACEHOLDER AND MUST BE REPLACED BEFORE THIS
# IS USED FOR A REAL PATIENT. The software refuses to print against a
# real database until the placeholders are gone.
#
# Nothing here is generated by the software. The medicines, the tests
# and the advice on the printed sheet are exactly what the doctor
# typed, character for character.
#
# Edit this file, save it, and press Print again. The program reads it
# fresh every time, so nobody has to restart anything.

# The doctor, as it should appear at the top of the page.
doctor:
  name:
    bn: "PLACEHOLDER — ডাক্তারের নাম"
    en: "PLACEHOLDER — DOCTOR'S NAME"
  # Degrees, exactly as they should be printed. One line.
  qualifications: "PLACEHOLDER — MBBS, FCPS (…)"
  # Speciality or designation, printed under the degrees. Optional.
  designation: "PLACEHOLDER — designation and institution"
  # The BMDC registration number. This is a legal requirement on a
  # prescription in Bangladesh: it must be the real one.
  registration: "PLACEHOLDER — BMDC Reg. No."

# Each chamber gets its own address block. The name must match the
# chamber name in the software exactly, so the right address is
# printed on the right evening.
chambers:
  - name: "Green Life Chamber, Dhanmondi"
    address:
      bn: "PLACEHOLDER — চেম্বারের ঠিকানা"
      en: "PLACEHOLDER — chamber address"
    phone: "PLACEHOLDER — 01XXXXXXXXX"
    hours:
      bn: "PLACEHOLDER — সময়"
      en: "PLACEHOLDER — hours"
  - name: "Al-Shifa Chamber, Savar"
    address:
      bn: "PLACEHOLDER — চেম্বারের ঠিকানা"
      en: "PLACEHOLDER — chamber address"
    phone: "PLACEHOLDER — 01XXXXXXXXX"
    hours:
      bn: "PLACEHOLDER — সময়"
      en: "PLACEHOLDER — hours"

# Printed small at the very bottom of every sheet. Use it for whatever
# the chamber wants there: emergency number, "bring this paper with
# you next time", and so on. Both languages are printed.
footer:
  bn: "PLACEHOLDER — পরের বার এই কাগজটি সঙ্গে আনুন।"
  en: "PLACEHOLDER — please bring this paper with you next time."

# Whether the working diagnosis is printed on the sheet the patient
# carries. Many chambers print it; some deliberately do not, because
# the paper is read by whoever the patient shows it to. It is the
# doctor's call, and it is his own wording either way.
print_diagnosis: true

# Whether today's vitals are printed under the patient's name. Useful
# to whoever sees them next; set to false to leave them off.
print_vitals: true

# A5 is the usual prescription pad size. A4 is also allowed.
paper: A5
